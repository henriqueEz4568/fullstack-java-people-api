spring.application.name=people-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/people}
spring.datasource.username=${DB_USER:people}
spring.datasource.password=${DB_PASSWORD:people}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

api.key=${API_KEY:dev-api-key}
nationalize.url=${NATIONALIZE_URL:https://api.nationalize.io}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
